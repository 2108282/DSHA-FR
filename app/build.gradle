plugins {
    id 'com.android.application'
}

// 两版共用功能和离线环境；只有 low 携带兼容旧 Android 的 Gecko 内核。

android {
    namespace 'com.deepseekharness.app'
    compileSdk {
        version = release(37)
    }
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "com.dsha.fr"
        minSdk 31
        targetSdk 37
        versionCode 161
        versionName "0.2.2-rc.3-phone-tasks-1"
        testInstrumentationRunner "com.deepseekharness.app.Rc13Instrumentation"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions 'androidSupport'
    productFlavors {
        standard {
            dimension 'androidSupport'
            minSdk 31
            buildConfigField 'boolean', 'LOW_ANDROID', 'false'
            resValue 'string', 'edition_description', '标准版 · Android 11+ · 系统 WebView'
            resValue 'string', 'browser_description', '使用系统 WebView，请保持 Android System WebView / Chrome 更新。'
        }

    }

    signingConfigs {
        // 线上发布签名 = DSHA-ACTUAL-PUBLISH-KEY-debug.keystore（alias androiddebugkey，
        // 证书 SHA-256 E7:E3:A3:1A:75:94:6F:26:69:19:4C:97:2B:3D:D0:C9:AE:A3:FC:7C:50:A8:B8:85:D2:DE:E7:10:B2:2A:53:F5）。
        // v1.1.7 起线上包都是这把 debug keystore 签的（历史原因，勿换），
        // Android 只允许同签名覆盖安装，换钥 = 逼用户卸载重装丢数据。
        // 另一把 DSHA-release.keystore 只签增量更新清单，绝不混用。
        // 用法：DSHA_KEYSTORE=/path/to/keystore（缺省时退回 AGP debug keystore，仅供本地调试）。
        publish {
            def ksPath = System.getenv("DSHA_KEYSTORE") ?: project.findProperty("dsha.keystore")
            if (ksPath != null && !ksPath.toString().isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("DSHA_KEYSTORE_PASSWORD")
                        ?: project.findProperty("dsha.keystore.password") ?: "android"
                keyAlias System.getenv("DSHA_KEY_ALIAS")
                        ?: project.findProperty("dsha.key.alias") ?: "androiddebugkey"
                keyPassword System.getenv("DSHA_KEY_PASSWORD")
                        ?: project.findProperty("dsha.key.password") ?: "android"
                println "签名：发布 keystore ${ksPath}（alias=${keyAlias}）"
            } else {
                println "⚠️ 签名：未配置 DSHA_KEYSTORE，退回 AGP debug keystore —— 仅供本地调试，不可覆盖正式版"
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            if (System.getenv("DSHA_KEYSTORE") != null && file(System.getenv("DSHA_KEYSTORE")).exists()) {
                signingConfig signingConfigs.publish
            }
        }
        release {
            minifyEnabled false
            if (System.getenv("DSHA_KEYSTORE") != null && file(System.getenv("DSHA_KEYSTORE")).exists()) {
                signingConfig signingConfigs.publish
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // 使用 app 自带的同版本 16 KB JNI，覆盖 terminal-emulator AAR 中的旧库。
            pickFirsts += ['**/libtermux.so']
            excludes += ['**/x86/**', '**/x86_64/**', '**/armeabi/**', '**/armeabi-v7a/**']
        }
    }

    androidResources {
        // 'bin' 是离线 rootfs：aapt 会把 .tar.gz 静默解成 .tar，所以打包前改名 .bin，
        // 保持 STORED（不 deflate），避免对已经压缩的离线运行时再压缩一次。
        noCompress += ['gz', 'xz', 'bin', 'ja', 'tar', 'whl']
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues = true
        aidl = true
        buildConfig = true
        viewBinding = true
    }

    sourceSets {
        main.assets.setSrcDirs([layout.buildDirectory.dir("generated/standardAssets")])
    }
}

def prepareStandardAssets = tasks.register("prepareStandardAssets", Exec) {
    inputs.dir("src/main/assets")
    inputs.file(rootProject.file("tools/prepare-standard-assets.py"))
    outputs.dir(layout.buildDirectory.dir("generated/standardAssets"))
    outputs.file(layout.buildDirectory.file("generated/standard-assets-report.json"))
    commandLine(System.getenv("DSHA_PYTHON") ?: "python3", "-B",
            rootProject.file("tools/prepare-standard-assets.py").absolutePath,
            "--source", file("src/main/assets").absolutePath,
            "--output", layout.buildDirectory.dir("generated/standardAssets").get().asFile.absolutePath)
}
tasks.named("preBuild").configure { dependsOn(prepareStandardAssets) }

// Hidden input signatures are compile-only: Android supplies these classes at runtime.
def compileGestureStubs = tasks.register("compileGestureStubs", JavaCompile) {
    source rootProject.fileTree("tools/gesture-stubs") { include "**/*.java" }
    classpath = files(androidComponents.sdkComponents.bootClasspath)
    destinationDirectory = layout.buildDirectory.dir("gesture-stubs")
    sourceCompatibility = "17"
    targetCompatibility = "17"
}

def gestureStubsJar = tasks.register("gestureStubsJar", Jar) {
    dependsOn(compileGestureStubs)
    from(compileGestureStubs.flatMap { it.destinationDirectory })
    archiveFileName = "gesture-hidden-api-stubs.jar"
    destinationDirectory = layout.buildDirectory.dir("gesture-stubs-jar")
}

// Keep new native dialogs on the shared themed builder; reject accidental one-off modal surfaces.
tasks.register("checkDialogEntrypoints", Exec) {
    commandLine(System.getenv("DSHA_PYTHON") ?: "python3", "-B",
            rootProject.file("tools/check-dialog-entrypoints.py").absolutePath)
}
tasks.named("preBuild").configure { dependsOn("checkDialogEntrypoints") }

// Run this pure Java component independently of legacy Android test sources.
configurations { cornerGestureTestDependencies }
def compileCornerGestureTests = tasks.register("compileCornerGestureTests", JavaCompile) {
    source files("src/main/java/com/deepseekharness/app/gesture/CornerGestureRecognizer.java",
            "src/test/java/com/deepseekharness/app/gesture/CornerGestureRecognizerTest.java")
    classpath = configurations.cornerGestureTestDependencies
    destinationDirectory = layout.buildDirectory.dir("corner-gesture-tests")
    options.release = 17
}
tasks.register("testCornerGesture", Test) {
    dependsOn(compileCornerGestureTests)
    testClassesDirs = files(compileCornerGestureTests.flatMap { it.destinationDirectory })
    classpath = testClassesDirs + configurations.cornerGestureTestDependencies
    useJUnit()
}

// Isolate microphone origin tests from legacy Android-dependent unit tests.
configurations { webMicrophoneTestDependencies }
def compileWebMicrophoneTests = tasks.register("compileWebMicrophoneTests", JavaCompile) {
    source files("src/main/java/com/deepseekharness/app/util/WebMicrophonePolicy.java",
            "src/test/java/com/deepseekharness/app/util/WebMicrophonePolicyTest.java")
    classpath = configurations.webMicrophoneTestDependencies
    destinationDirectory = layout.buildDirectory.dir("web-microphone-tests")
    options.release = 17
}
tasks.register("testWebMicrophone", Test) {
    dependsOn(compileWebMicrophoneTests)
    testClassesDirs = files(compileWebMicrophoneTests.flatMap { it.destinationDirectory })
    classpath = testClassesDirs + configurations.webMicrophoneTestDependencies
    useJUnit()
}

dependencies {
    webMicrophoneTestDependencies 'junit:junit:4.13.2'
    cornerGestureTestDependencies 'junit:junit:4.13.2'
    compileOnly files(gestureStubsJar.flatMap { it.archiveFile })
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    // 真 PTY 终端：Termux 拆出的 terminal-view/terminal-emulator（Apache 2.0），
    // 自带 JNI PTY 层（openpty+fork/exec）。坐标是 JitPack 多模块真实 groupId
    // （com.termux.termux-app），不是 Wiki 上会 401 的 com.termux:terminal-view。
    implementation 'com.termux.termux-app:terminal-view:0.118.0'

    // 圈定即搜重定向（Xposed 模块部分，合并式：业务 App 与模块同包）
    // api 必须 compileOnly：实例由 LSPosed 运行时注入，打包进去会冲突。
    compileOnly 'io.github.libxposed:api:101.0.1'
    implementation 'io.github.libxposed:service:101.0.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // 万能文件查看与编辑器扩展：Sora Editor (代码编辑与语法高亮) + 压缩包解析
    implementation 'io.github.Rosemoe.sora-editor:editor:0.23.5'
    implementation 'org.apache.commons:commons-compress:1.26.1'

    testImplementation 'junit:junit:4.13.2'
}
