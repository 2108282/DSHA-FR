# dsh-app: phone control (手机操控). The DSH App rewrites this file at every engine start and
# passes it with --patch only while phone control is on (never in safe mode). Edits do not survive.
- insert:
    - id: dsh-app-phone
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: phone
        transport: stdio
        command: !!js process.execPath
        args:
          - /opt/dsh-app/phone/relay.cjs
          - /var/lib/dsh-app/phone/bridge.json
        toolCallTimeoutMs: 660000
        failOnStartupError: false
